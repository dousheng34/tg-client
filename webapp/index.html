<!DOCTYPE html>
<html lang="kk">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Adebiette Alemi - Oqu Game</title>
      <script src="https://telegram.org/js/telegram-web-app.js"></script>
      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
      <style>
                :root {
                              --primary: #2c3e50;
                              --secondary: #34495e;
                              --accent: #e67e22;
                              --success: #27ae60;
                              --bg: #f5f6fa;
                              --text: #2f3640;
                              --white: #ffffff;
                }

                * {
                              box-sizing: border-box;
                              margin: 0;
                              padding: 0;
                              -webkit-tap-highlight-color: transparent;
                }
                body {
                              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                              background-color: var(--bg);
                              color: var(--text);
                              line-height: 1.6;
                              overflow-x: hidden;
                }

                .container {
                              max-width: 600px;
                              margin: 0 auto;
                              padding: 20px;
                }

                header {
                              background: linear-gradient(135deg, var(--primary), var(--secondary));
                              color: var(--white);
                              padding: 25px 20px;
                              text-align: center;
                              border-radius: 0 0 25px 25px;
                              box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                              margin-bottom: 20px;
                }

                h1 { font-size: 1.8rem; margin-bottom: 5px; }
                .subtitle { font-size: 0.9rem; opacity: 0.9; }
        <body>
            <div id="home-view">
                <header>
                    <h1>Adebiette Alemi</h1>
                    <p class="subtitle">7-9 grade curriculum alignment</p>
                </header>

                <div class="container">
                    <div class="stats-bar">
                        <div class="stat-item">
                            <span class="stat-value" id="total-score">0</span>
                            <span class="stat-label">Points</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="games-played">0</span>
                            <span class="stat-label">Games</span></div>
                        <div class="stat-item">
                            <span class="stat-value" id="rank">Beginner</span>
                            <span class="stat-label">Level</span></div></div>
                    <div class="game-grid">
                        <div class="game-card" onclick="startGame('quiz')">
                            <i class="fas fa-question-circle"></i>
                            <h3>Quiz</h3>
                            <p>7-9 grade questions</p>
                        </div>
                        <div class="game-card" onclick="startGame('who')">
                            <i class="fas fa-user-edit"></i>
                            <h3>Who wrote?</h3>
                            <p>Find the author</p>
                        </div>
                        <div class="game-card" onclick="startGame('blitz')">
                            <i class="fas fa-bolt"></i>
                            <h3>Blitz</h3>
                            <p>Speed test</p>
                        </div>
                        <div class="game-card" onclick="startGame('quotes')">
                            <i class="fas fa-quote-left"></i>
                            <h3>Quotes</h3>
                            <p>Continue the quote</p>
                        </div>
                        <div class="game-card" onclick="startGame('memory')">
                            <i class="fas fa-th"></i>
                            <h3>Memory</h3>
                            <p>Find the pair</p>
                        </div>
                        <div class="game-card" onclick="startGame('timeline')">
                            <i class="fas fa-history"></i>
                            <h3>Timeline</h3>
                            <p>Put in order</p>
                        </div>
                    </div>
                    <div style="background:#e1f5fe;padding:15px;border-radius:15px;border:1px solid #b3e5fc">
                        <h4 style="color:#0277bd;margin-bottom:8px"><i class="fas fa-star"></i> Topic of the week:</h4>
                        <p style="font-size:0.9rem">"Jau tylyndagy bala" - Kasym Kaisenov. Double points for this topic!</p>
                    </div>
                </div>
      </div>

            <div id="game-view" class="container">
                <div id="game-header" style="display:flex;justify-content:space-between;margin-bottom:15px">
                    <span id="game-title" style="font-weight:700">Game</span>
                    <span id="current-points" style="color:var(--accent)">+10 points</span>
                </div>
                <div id="timer-wrap"><div id="timer-bar"></div></div>
                <div id="game-content"></div>
                <button class="btn btn-secondary" onclick="exitGame()">Exit Game</button>
            </div>

            <div id="result-modal" class="modal">
                <div class="modal-content">
                    <h2 id="result-title">Great!</h2>
                    <div style="font-size:3rem;margin:20px 0;color:var(--accent)" id="result-score">0</div>
                    <p id="result-text">New record!</p>
                    <button class="btn" onclick="closeResult()">Menu</button>
                </div>
            </div>
            <script>
                let tg = window.Telegram.WebApp;
                tg.expand();

                let score = parseInt(localStorage.getItem('edu_score') || 0);
                let games = parseInt(localStorage.getItem('edu_games') || 0);

                const data = {
                              quiz: [
                                                { q: "In 'Jau tylyndagy bala', who is the main character?", a: ["Serik", "Serezha", "Bolat", "Vasya"], c: 1 },
                        { q: "In 'Koksekrek', who raised the wolf?", a: ["Kurmash", "Ali", "Asan", "Batyr"], c: 0 },
                        { q: "In which century did Kaztugan zhyrau live?", a: ["XV", "XVII", "XIX", "XIII"], c: 0 },
                        { q: "Orkhon-Enisei script is used on which monument?", a: ["Arab", "Latin", "Kultegin", "Cyrillic"], c: 2 },
                        { q: "Where does 'Jau tylyndagy bala' take place?", a: ["Germany", "Ukraine", "Russia", "Poland"], c: 1 }
                    ],
                    who: [
                        { q: "Author of 'Abai Zholy'?", a: ["S. Mukanov", "M. Auezov", "G. Musrepov", "J. Aimauytov"], c: 1 },
                        { q: "Author of 'Men jastarga senemin'?", a: ["M. Jumabayev", "A. Baitursynov", "M. Dulatov", "S. Kudaiberdiuly"], c: 0 },
                        { q: "'Oyan, qazaq!' slogan author?", a: ["S. Toraigyrov", "M. Dulatov", "A. Kunanbayev", "J. Jabaev"], c: 1 }
                    ],
                    quotes: [
                        { q: "'Olen - sozdin patshasy, soz ...'", a: ["sarasy", "danasy", "magynasy", "tulgasy"], c: 0 },
                        { q: "'Enbek etsen erinbei, toyady ...'", a: ["ishin berilmei", "qarnyn tilenbei", "omirin tungilmei", "bagyn jenilmei"], c: 1 }
                    ]
        };
                let currentPoints = 0;
                let timerInterval;

                function updateStats() {
                              document.getElementById('total-score').innerText = score;
                              document.getElementById('games-played').innerText = games;

                              let rank = "Beginner";
                              if(score > 500) rank = "Reader";
                              if(score > 1000) rank = "Expert";
                              if(score > 2000) rank = "Master";

                              document.getElementById('rank').innerText = rank;
                              localStorage.setItem('edu_score', score);
                              localStorage.setItem('edu_games', games);
                }

                function startGame(type) {
                              document.getElementById('home-view').style.display = 'none';
                              document.getElementById('game-view').style.display = 'block';
                              document.getElementById('game-title').innerText = getGameName(type);
                              currentPoints = 0;
                              loadGameContent(type);
                }

                function getGameName(type) {
                              const names = {
                                                quiz: "Quiz",
                                                                  who: "Who wrote?",
                                                                  blitz: "Blitz",
                                  quotes: "Quotes",
                                  memory: "Memory",
                                  timeline: "Timeline"
                };
                    return names[type];
                }
                function loadGameContent(type) {
                              const content = document.getElementById('game-content');
                              content.innerHTML = "";

                              if(type === 'quiz' || type === 'who' || type === 'quotes') {
                                                const list = data[type];
                                                const item = list[Math.floor(Math.random() * list.length)];

                                                content.innerHTML = `<h3 style="margin-bottom:20px">${item.q}</h3>`;
                                                item.a.forEach((opt, idx) => {
                                                                      content.innerHTML += `<button class="option-btn" onclick="checkAnswer(this, ${idx === item.c})">${opt}</button>`;
                                                  });
                              } else if(type === 'memory') {
                                                content.innerHTML = '<div class="memory-grid"></div>';
                                                const grid = content.querySelector('.memory-grid');
                                                const terms = ["Abai", "Kara sozdar", "Auezov", "Abai zholy", "Kaisenov", "Jau tyly", "Jambyl", "Leningradtyk", "Magjan", "Senemin"];
                                                terms.sort(() => Math.random() - 0.5).forEach(term => {
                                                                      grid.innerHTML += `<div class="memory-card" onclick="this.classList.toggle('flipped'); this.innerText='${term}'">?</div>`;
                                                  });
                                                  } else {
                                                                    content.innerHTML = "<h3>Under construction</h3>";
                                                  }
                                                }

                                        function checkAnswer(btn, isCorrect) {
                                                      const btns = document.querySelectorAll('.option-btn');
                                                      btns.forEach(b => b.disabled = true);

                                                      if(isCorrect) {
                                                                        btn.classList.add('correct');
                                                                        currentPoints += 20;
                                                                        score += 20;
                                                                        setTimeout(() => showResult(true), 1000);
                                                        } else {
                                                                          btn.classList.add('wrong');
                                                                          setTimeout(() => showResult(false), 1000);
                                                          }
                                                                      updateStats();
                                                        }

                                                                function showResult(win) {
                                                                              games++;
                                                                              updateStats();
                                                                              document.getElementById('result-modal').style.display = 'flex';
                                                                              document.getElementById('result-score').innerText = win ? `+${currentPoints}` : "0";
                                                                              document.getElementById('result-title').innerText = win ? "Great!" : "Next time!";
                                                                  }

                                                                          function closeResult() {
                                                                                            document.getElementById('result-modal').style.display = 'none';
                                                                                            exitGame();
                                                                              }

                                                                          function exitGame() {
                                                                                        document.getElementById('home-view').style.display = 'block';
                                                                                        document.getElementById('game-view').style.display = 'none';
                                                                          }

                                                                          updateStats();
                                                                      </script>
                                                                  </body>

                                                                  </body>
        </html>
